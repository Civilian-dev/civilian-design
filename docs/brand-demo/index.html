<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brand assets</title>
    <style>
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--colors-bg-canvas);
        color: var(--colors-fg-default);
        font-family: "Instrument Sans", sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        font-family: Poppins, sans-serif;
        font-weight: 500;
        letter-spacing: -0.025em;
      }
      form {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px 16px;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 0.875rem;
        color: var(--colors-fg-subtle);
      }
      select,
      input,
      button {
        font: inherit;
        padding: 6px 8px;
        border: 1px solid var(--colors-border-strong, #aab7b9);
        border-radius: 0;
        background: var(--colors-bg-default, #fff);
        color: inherit;
      }
      figure {
        margin: 24px 0 12px;
      }
      figure img {
        display: block;
        max-width: 100%;
        height: auto;
        border: 1px solid var(--colors-border-default, #e0e6e7);
      }
      figcaption,
      #error {
        margin-top: 8px;
        font-size: 0.875rem;
      }
      #error {
        color: var(--colors-red-500);
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brand assets</h1>
      <form id="dials">
        <label>Size<select name="preset"></select></label>
        <label>Width<input name="width" type="number" min="1" max="8000" value="1280" /></label>
        <label>Height<input name="height" type="number" min="1" max="8000" value="288" /></label>
      </form>
      <figure>
        <img id="preview" alt="" />
        <figcaption id="caption"></figcaption>
      </figure>
      <p id="error"></p>
      <div class="actions">
        <button type="button" data-format="svg">Download SVG</button>
        <button type="button" data-format="png" data-density="1">Download PNG</button>
        <button type="button" data-format="png" data-density="2">Download PNG @2x</button>
      </div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
