name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Pages previews need write access, so fork PRs (read-only token) are skipped.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble preview site
        if: github.event.action != 'closed'
        run: |
          mkdir -p preview-site/fonts
          cp -R docs/brand-seeds/. preview-site/
          cp packages/design-tokens/dist/tokens.css preview-site/tokens.css
          cp packages/brand-graphics/src/patterns.css preview-site/patterns.css
          cp packages/claude-design-system/design-system/project/fonts/*.woff2 preview-site/fonts/
          find preview-site -name '*.html' -exec sed -i 's#\.\./\.\./packages/design-tokens/dist/tokens\.css#tokens.css#g' {} +
          find preview-site -name '*.html' -exec sed -i 's#\.\./\.\./packages/brand-graphics/src/patterns\.css#patterns.css#g' {} +
          sed -i 's#\.\./\.\./packages/claude-design-system/design-system/project/fonts/#fonts/#g' preview-site/seeds.css
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: preview-site
          wait-for-pages-deployment: true
